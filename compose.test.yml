services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: transcendence_test
      POSTGRES_PASSWORD: test
      POSTGRES_USER: test
    ports:
      - '127.0.0.1:5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U test -d transcendence_test']
      interval: 2s
      timeout: 3s
      retries: 20
